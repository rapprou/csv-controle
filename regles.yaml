# Règles de contrôle qualité appliquées à l'export CSV.

# Colonnes qui doivent être renseignées sur chaque ligne.
colonnes_obligatoires:
  - id_mission
  - benevole_nom
  - email
  - date_debut

# Colonnes qui identifient une mission : deux lignes de mêmes valeurs sur ces
# colonnes (après normalisation) sont des doublons exacts.
colonnes_cles:
  - email
  - date_debut

# Valeurs considérées comme manquantes (comparaison insensible à la casse,
# espaces de début et de fin ignorés).
valeurs_manquantes:
  - ""
  - "N/A"
  - "n/a"
  - "null"
  - "-"

# Quasi-doublons : lignes très proches sans être identiques (fautes de frappe).
# Seules les lignes partageant la même valeur de champ_blocage sont comparées.
quasi_doublons:
  actif: true
  seuil: 90
  champs:
    - benevole_nom
    - email
  champ_blocage: date_debut
